name: Test rclone secret

on:
  workflow_dispatch:

jobs:
  test-rclone:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar rclone
        run: sudo apt-get install -y rclone

      - name: Restaurar config de rclone desde secret
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Listar carpetas en Google Drive (prueba de conexión)
        run: rclone lsd "gdrive:"

      - name: Crear carpeta de prueba en Drive
        run: rclone mkdir "gdrive:veconos-test"

      - name: Confirmar que la carpeta se creó
        run: rclone lsd "gdrive:"
